<!-- pln-news-monitor/templates/edit.html -->
{% extends 'base.html' %}

{% block title %}Edit Berita{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Data Berita</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="judul_pemberitaan" class="form-label">Judul Pemberitaan</label>
                        <textarea class="form-control" id="judul_pemberitaan" name="judul_pemberitaan" rows="3" required>{{ news.judul_pemberitaan }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="link_pemberitaan" class="form-label">Link Pemberitaan</label>
                        <input type="text" class="form-control" id="link_pemberitaan" value="{{ news.link_pemberitaan }}" disabled readonly>
                        <div class="form-text">Link tidak dapat diubah.</div>
                    </div>
                    <div class="mb-3">
                        <label for="kategori_media" class="form-label">Kategori Media</label>
                        <select class="form-select" id="kategori_media" name="kategori_media" required>
                            <option value="Nasional" {% if news.kategori_media == 'Nasional' %}selected{% endif %}>Nasional</option>
                            <option value="Lokal" {% if news.kategori_media == 'Lokal' %}selected{% endif %}>Lokal</option>
                            <option value="Internasional" {% if news.kategori_media == 'Internasional' %}selected{% endif %}>Internasional</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('pemberitaan') }}" class="btn btn-secondary me-2">Batal</a>
                        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
