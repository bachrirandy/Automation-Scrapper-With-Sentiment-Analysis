{% extends 'base.html' %}
{% block page_title %}Edit Data Analisis{% endblock %}

{% block title %}Edit Data Analisis{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Data Log Analisis</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="judul_pemberitaan" class="form-label fw-bold">Judul Pemberitaan</label>
                        <textarea class="form-control" id="judul_pemberitaan" name="judul_pemberitaan" rows="3" required>{{ item.judul_pemberitaan }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="link_pemberitaan" class="form-label fw-bold">Link Pemberitaan</label>
                        <input type="text" class="form-control" id="link_pemberitaan" value="{{ item.link_pemberitaan }}" disabled readonly>
                        <div class="form-text">Link tidak dapat diubah.</div>
                    </div>
                    <div class="mb-3">
                        <label for="sentimen" class="form-label fw-bold">Sentimen</label>
                        <select class="form-select" id="sentimen" name="sentimen" required>
                            <option value="Positif" {% if item.sentimen == 'Positif' %}selected{% endif %}>Positif</option>
                            <option value="Netral" {% if item.sentimen == 'Netral' %}selected{% endif %}>Netral</option>
                            <option value="Negatif" {% if item.sentimen == 'Negatif' %}selected{% endif %}>Negatif</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('analisis') }}" class="btn btn-secondary me-2">Batal</a>
                        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
